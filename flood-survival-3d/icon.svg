  </g>
  <rect x="176" y="236" width="160" height="96" rx="6" fill="#c9a875"/>
  <rect x="228" y="270" width="56" height="62" rx="4" fill="#3b2a17" opacity=".55"/>
  <g fill="#5c4229">
    <rect x="188" y="332" width="20" height="96" rx="6"/>
    <rect x="304" y="332" width="20" height="96" rx="6"/>
    <rect x="246" y="332" width="20" height="96" rx="6"/>
  </g>

  <!-- flood -->
  <path d="M0 372c46-22 82 14 128 14s72-30 120-30 78 30 126 30 92-30 138-14v150H0z" fill="url(#sea)"/>
  <path d="M0 372c46-22 82 14 128 14s72-30 120-30 78 30 126 30 92-30 138-14v22c-46-16-92 14-138 14s-78-30-126-30-72 30-120 30S46 394 0 416z" fill="#dfeef2" opacity=".75"/>
