<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pup Runway</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pink:#ff5fa2;--pink2:#ffd1e6;--purple:#7b3fe4;--ink:#2b1640;--card:#fff;--gold:#ffc83d;--bg1:#ffe3f1;--bg2:#e7dcff}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 84px)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.logo{font-weight:900;font-size:1.45rem;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:6px;align-items:center}
.chip{background:#fff;border-radius:99px;padding:6px 12px;font-weight:800;box-shadow:0 2px 0 #0001;white-space:nowrap}
.chip.money{color:#118a3e}
.iconbtn{background:#fff;border-radius:99px;width:36px;height:36px;box-shadow:0 2px 0 #0001;font-size:1.1rem}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;box-shadow:0 -4px 20px #7b3fe422;
  padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:.68rem;font-weight:700;color:#8a7a99}
nav button span{font-size:1.35rem;line-height:1}
nav button.on{color:var(--pink);background:#fff0f7}

/* cards & buttons */
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 4px 0 #7b3fe41a,0 8px 24px #7b3fe414;margin-bottom:12px}
h2{font-size:1.3rem;margin-bottom:6px}
h3{font-size:1.05rem;margin-bottom:6px}
.muted{color:#8a7a99;font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:16px;font-weight:800;font-size:1rem;
  background:linear-gradient(180deg,#ff7ab6,var(--pink));color:#fff;box-shadow:0 4px 0 #c93a7c;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c93a7c}
.btn.purple{background:linear-gradient(180deg,#9a6bff,var(--purple));box-shadow:0 4px 0 #5324a8}
.btn.gold{background:linear-gradient(180deg,#ffe07a,var(--gold));color:#5a3a00;box-shadow:0 4px 0 #c99416}
.btn.ghost{background:#f3ecff;color:var(--purple);box-shadow:0 4px 0 #d9c9ff}
.btn.big{width:100%;padding:16px;font-size:1.15rem}
.btn[disabled]{filter:grayscale(1);opacity:.55;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.center{text-align:center}
.stack>*+*{margin-top:10px}

/* dog */
svg.dog{display:block;width:100%;height:auto;overflow:visible}
.dogstage{position:relative;border-radius:18px;background:radial-gradient(circle at 50% 80%,#fff 0,#fff0 60%),linear-gradient(180deg,#ffd9ec,#efe4ff);padding:10px 30px 0}
.dogstage .floor{position:absolute;left:10%;right:10%;bottom:8px;height:16px;border-radius:50%;background:#7b3fe422}
.dogstage svg{position:relative;max-width:260px;margin:0 auto}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.xpbar{height:14px;background:#f1e8ff;border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:99px;transition:width .5s}
.lvl{display:inline-block;background:var(--purple);color:#fff;border-radius:99px;padding:2px 10px;font-weight:800;font-size:.85rem}
.tag{display:inline-block;background:#f3ecff;color:var(--purple);border-radius:99px;padding:2px 8px;font-size:.72rem;font-weight:700;margin:2px 2px 0 0}

/* grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{position:relative;background:#fff;border-radius:16px;padding:8px 6px 6px;text-align:center;border:3px solid #eee;box-shadow:0 3px 0 #0000000d;font-size:.75rem;font-weight:700}
.tile svg{width:100%;height:64px;display:block}
.tile.on{outline:3px solid var(--pink);outline-offset:2px}
.tile .nm{display:block;line-height:1.15;min-height:2.3em}
.tile .badge{position:absolute;top:4px;right:4px;font-size:.9rem}
.r-common{border-color:#d9d3e0}.r-rare{border-color:#4ea8ff}.r-epic{border-color:#b15cff}.r-legendary{border-color:#ffb800;background:linear-gradient(180deg,#fffbe6,#fff)}
.rt{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.rt-common{color:#8d8597}.rt-rare{color:#2b8ae6}.rt-epic{color:#9b3fe8}.rt-legendary{color:#d99500}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tabs button{flex:0 0 auto;padding:8px 12px;border-radius:99px;background:#fff;font-weight:800;font-size:.85rem;box-shadow:0 2px 0 #0001}
.tabs button.on{background:var(--pink);color:#fff}

/* challenges list */
.chal{display:flex;gap:12px;align-items:center;cursor:pointer}
.chal .ico{font-size:2.3rem;width:62px;height:62px;display:grid;place-items:center;border-radius:18px;background:#fff0f7;flex:0 0 auto}

/* game area */
.gamebar{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:8px;gap:8px}
.gamebar .pill{background:#fff;border-radius:99px;padding:6px 12px;box-shadow:0 2px 0 #0001}
canvas.game{display:block;width:100%;border-radius:18px;background:#bfe9ff;touch-action:none}
.tapzone{position:relative;height:min(62vh,480px);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#b9f0c8,#7fd99a);touch-action:manipulation}
.tapzone .ball{position:absolute;font-size:2.6rem;transform:translate(-50%,-50%) scale(0);animation:pop .18s forwards;cursor:pointer;line-height:1;padding:8px}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}
.tapzone .ball.gone{animation:gone .2s forwards}
@keyframes gone{to{transform:translate(-50%,-50%) scale(0);opacity:0}}
.tricks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tricks button{background:#fff;border-radius:18px;padding:14px 6px;font-weight:800;font-size:1rem;box-shadow:0 4px 0 #0000001a;border:3px solid transparent}
.tricks button span{display:block;font-size:2rem}
.tricks button.lit{border-color:var(--pink);background:#fff0f7;transform:scale(1.05)}
.tricks button:disabled{opacity:.6}
.trick-sit{animation:tsit .6s}
@keyframes tsit{50%{transform:scaleY(.8) translateY(10%)}}
.trick-spin{animation:tspin .6s}
@keyframes tspin{to{transform:rotate(360deg)}}
.trick-paw{animation:tpaw .6s}
@keyframes tpaw{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.trick-roll{animation:troll .6s}
@keyframes troll{50%{transform:scaleX(-1) translateY(-8%)}}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#2b164088;padding:18px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:24px;padding:20px;max-width:400px;width:100%;text-align:center;animation:modalin .25s;max-height:90vh;overflow:auto}
@keyframes modalin{from{transform:scale(.8);opacity:0}}
.gift{font-size:5rem;display:inline-block;animation:shake .5s infinite}
@keyframes shake{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.reveal{animation:revealin .4s}
@keyframes revealin{from{transform:scale(.3) rotate(-20deg);opacity:0}}

/* show */
.stage{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#2a0f46,#51207a 60%,#1b0930);height:360px;color:#fff}
.stage .spot{position:absolute;top:-40px;width:180px;height:420px;background:linear-gradient(180deg,#fff6,#fff0);filter:blur(6px);transform-origin:top center}
.stage .spot.l{left:10%;animation:sway 3s ease-in-out infinite}
.stage .spot.r{right:10%;animation:sway 3s ease-in-out infinite reverse}
@keyframes sway{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.stage .runway{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(180deg,#ff5fa2,#b8307a);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.stage .crowd{position:absolute;left:0;right:0;bottom:0;font-size:1.6rem;letter-spacing:-2px;text-align:center;opacity:.9;white-space:nowrap;overflow:hidden}
.stage .walker{position:absolute;bottom:40px;left:50%;width:170px;margin-left:-85px;transform:translateX(-160%);transition:transform 1.3s cubic-bezier(.3,.8,.4,1)}
.stage .walker.in{transform:translateX(0)}
.stage .walker.out{transform:translateX(170%)}
.stage .walker svg{animation:strut .45s ease-in-out infinite alternate}
@keyframes strut{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-5px)}}
.stage .cap{position:absolute;top:12px;left:0;right:0;text-align:center;font-weight:900;font-size:1.1rem;text-shadow:0 2px 6px #000;padding:0 10px}
.stage .sub{position:absolute;top:40px;left:0;right:0;text-align:center;font-size:.9rem;opacity:.85}
.stage .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.stage .flash.go{animation:flash .3s}
@keyframes flash{30%{opacity:.7}}
.stage .popup{position:absolute;top:80px;left:0;right:0;text-align:center;font-size:1.8rem;font-weight:900;color:var(--gold);text-shadow:0 3px 8px #000;animation:popup .9s forwards}
@keyframes popup{from{transform:scale(.4);opacity:0}30%{transform:scale(1.15);opacity:1}to{transform:translateY(-30px);opacity:0}}
.posebar{position:relative;height:30px;border-radius:99px;background:#efe6ff;overflow:hidden;margin:10px 0}
.posebar .zone{position:absolute;top:0;bottom:0;background:#ffe07a}
.posebar .zone.p{background:#ffb800}
.posebar .mk{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--purple);border-radius:3px}

.result{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:#faf6ff;margin-bottom:8px;animation:revealin .35s}
.result.me{background:#fff0f7;outline:2px solid var(--pink)}
.result .pl{font-size:1.6rem;width:36px;text-align:center}
.result .mini{width:56px;flex:0 0 auto}
.result .sc{font-weight:900;font-size:1.3rem;color:var(--purple)}
.breakdown{width:100%;border-collapse:collapse;font-size:.9rem}
.breakdown td{padding:4px 2px;border-bottom:1px dashed #eee}
.breakdown td:last-child{text-align:right;font-weight:800}

.wheelwrap{position:relative;max-width:300px;margin:0 auto;padding-top:14px}
.wheelwrap .wheel{display:block;width:100%;height:auto;border-radius:50%;box-shadow:0 6px 0 #7b3fe433,0 0 0 6px #fff,0 0 0 10px var(--purple)}
.wheelwrap .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:2;font-size:2rem;color:var(--pink);text-shadow:0 2px 0 #fff,0 3px 6px #0004;transform-origin:50% 20%}
.wheelwrap .pointer.tick{animation:tick .12s}
@keyframes tick{50%{transform:translateX(-50%) rotate(-18deg)}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

input.name{font:inherit;font-weight:800;font-size:1.1rem;padding:10px 14px;border-radius:14px;border:3px solid #eadcff;width:100%;text-align:center;color:var(--ink)}
.starter{cursor:pointer;border:3px solid transparent}
.starter.on{border-color:var(--pink)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🐾 Pup Runway</div>
    <div class="chips">
      <div class="chip money" id="money">$0</div>
      <button class="iconbtn" id="mute" title="Sound">🔊</button>
    </div>
  </header>
  <main id="screen"></main>
</div>
<nav><div class="in">
  <button data-nav="home"><span>🏠</span>Home</button>

  <button data-nav="wardrobe"><span>👗</span>Dress Up</button>
  <button data-nav="show"><span>✨</span>Show</button>
  <button data-nav="dogs"><span>🐶</span>Dogs</button>

</div></nav>
<div id="modal"><div class="box" id="modalbox"></div></div>

function beep(freq=660, dur=0.08, type='sine', vol=0.08){
  if (state && state.muted) return;

    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);

    o.start(); o.stop(actx.currentTime + dur);

}

   ===================================================================== */
function styleScore(dog, outfit, themeId){
  const items = SLOTS.map(s => outfit[s]).filter(Boolean).map(id => ITEMS[id]);
  const itemPts = items.reduce((t,it) => t + RARITY[it.rarity].pts, 0);
  const themed = items.filter(it => it.tags.includes(themeId));
  const themePts = themed.reduce((t,it) => t + RARITY[it.rarity].pts, 0);
  const full = items.length === SLOTS.length ? 10 : 0;
  const charm = BREEDS[dog.breed].charm + dog.level*4;
  return { itemPts, themePts, themedCount:themed.length, full, charm, total:itemPts + themePts + full + charm };
}

const pendingModals = [];
function giveXP(dog, amount){
  dog.xp += amount;
  while (dog.xp >= xpNeed(dog.level)){

    pendingModals.push(() => levelUpModal(dog));
  }
}
function levelUpModal(dog){

function modal(html){
  return new Promise(res => {
    $('#modalbox').innerHTML = html; $('#modal').classList.add('show');
    $('#modalbox').onclick = e => {
      const b = e.target.closest('[data-close]'); if (!b) return;
      $('#modal').classList.remove('show'); res(b.dataset.close);

}
async function flushModals(){ while (pendingModals.length) await pendingModals.shift()(); }

function rollPrize(level){
  // 1 in 5 wins are a whole new dog, while there are dogs left to find
  const ownedBreeds = new Set(state.dogs.map(d => d.breed));
  const freeBreeds = Object.keys(BREEDS).filter(b => !ownedBreeds.has(b));
  const rw = r => RARITY[r].w * (r==='common' ? 1 : 1 + level*(r==='legendary' ? .35 : r==='epic' ? .15 : .05));
  if (freeBreeds.length && Math.random() < .2){
    return { kind:'dog', breed: weighted(freeBreeds, b => rw(BREEDS[b].rarity)) };
  }
  const free = Object.keys(ITEMS).filter(id => !state.items.includes(id));
  if (!free.length) return { kind:'cash', amount: 500 };
  return { kind:'item', id: weighted(free, id => rw(ITEMS[id].rarity)) };
}

const GAMES = {};
function hud(timeLeft, goal, score){
  if (timeLeft != null) $('#timer').textContent = '⏱ ' + Math.ceil(timeLeft);
  if (goal != null) $('#goal').textContent = goal;
  if (score != null) $('#score').textContent = score;
}
function loop(fn){
  let raf, last = performance.now(), alive = true;
  const step = t => { if (!alive) return; const dt = Math.min(.05, (t-last)/1000); last = t; fn(dt); raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
  return () => { alive = false; cancelAnimationFrame(raf); };
}

GAMES.catch = (dog, area, done) => {
  const L = dog.level, W = 360, H = 480;
  const goal = Math.min(40, 12 + L*2), dur = 30;
  area.innerHTML = `<canvas class="game" width="${W}" height="${H}"></canvas>`;
  $('#hint').textContent = 'Drag, move your finger, or use ← → keys';
  const cv = area.querySelector('canvas'), ctx = cv.getContext('2d'), img = dogImage(dog);
  let x = W/2, target = W/2, t = dur, score = 0, spawn = 0, hurt = 0, keys = {}, drops = [], over = false;
  const toX = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; };
  cv.onpointerdown = cv.onpointermove = e => { target = toX(e); };
  const kd = e => { keys[e.key] = true; }, ku = e => { keys[e.key] = false; };
  addEventListener('keydown', kd); addEventListener('keyup', ku);
  const stop = loop(dt => {
    if (over) return;
    t -= dt;
    if (keys.ArrowLeft) target = x - 400*dt; if (keys.ArrowRight) target = x + 400*dt;
    target = Math.max(30, Math.min(W-30, target)); x += (target - x) * Math.min(1, dt*14);
    spawn -= dt;
    if (spawn <= 0){
      spawn = Math.max(.32, .75 - L*.025);
      const r = Math.random();
      drops.push({ x: rnd(20, W-20), y: -20, v: 150 + L*9 + rnd(0,60), k: r < .18 + Math.min(.12, L*.01) ? 'bee' : r < .3 ? 'meat' : 'bone' });
    }
    for (const d of drops){
      d.y += d.v*dt;
      if (d.y > H-95 && d.y < H-40 && Math.abs(d.x - x) < 42){
        d.dead = true;
        if (d.k === 'bee'){ score = Math.max(0, score-2); hurt = .4; beep(180,.15,'sawtooth'); }
        else { score += d.k === 'meat' ? 2 : 1; beep(d.k==='meat'?990:780,.06); }
      }
      if (d.y > H+20) d.dead = true;
    }
    drops = drops.filter(d => !d.dead); hurt -= dt;
    // draw
    const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#bfe9ff'); g.addColorStop(1,'#e8f8ff');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#8fdc8f'; ctx.fillRect(0,H-30,W,30);
    ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const d of drops) ctx.fillText(d.k==='bee'?'🐝':d.k==='meat'?'🍖':'🦴', d.x, d.y);
    ctx.globalAlpha = hurt > 0 && Math.floor(hurt*20)%2 ? .4 : 1;
    if (img.complete) ctx.drawImage(img, x-45, H-130, 90, 101);
    ctx.globalAlpha = 1;
    hud(t, `🎯 ${goal}`, `🦴 ${score}`);
    if (score >= goal){ over = true; done(true, `${dog.name} caught ${score} treats!`); }
    else if (t <= 0){ over = true; done(false, `Caught ${score} of ${goal} treats. Try again!`); }
  });
  return { stop(){ stop(); removeEventListener('keydown', kd); removeEventListener('keyup', ku); } };
};

GAMES.hurdle = (dog, area, done) => {
  const L = dog.level, W = 480, H = 270, GROUND = 225;
  const goal = 8 + L, speed = 230 + L*14;
  area.innerHTML = `<canvas class="game" width="${W}" height="${H}"></canvas>`;
  $('#hint').textContent = 'Tap the course or press Space to jump';
  const cv = area.querySelector('canvas'), ctx = cv.getContext('2d'), img = dogImage(dog);
  let y = 0, vy = 0, lives = 3, cleared = 0, hurdles = [], next = 1.2, hurt = 0, over = false, dist = 0, clouds = [[60,40],[260,70],[420,30]];
  const jump = () => { if (y === 0){ vy = 620; beep(620,.08,'square',.05); } };
  cv.onpointerdown = e => { e.preventDefault(); jump(); };
  const kd = e => { if (e.code === 'Space' || e.key === 'ArrowUp'){ e.preventDefault(); jump(); } };
  addEventListener('keydown', kd);
  const stop = loop(dt => {
    if (over) return;
    dist += speed*dt;
    vy -= 1700*dt; y = Math.max(0, y + vy*dt); if (y === 0) vy = Math.max(0, vy);
    next -= dt;
    if (next <= 0){ hurdles.push({ x: W+20, h: ri(34, 46 + Math.min(20, L*2)), passed:false }); next = rnd(.85, 1.6) * Math.max(.6, 1 - L*.02); }
    const dx = 70, dy = GROUND - y;
    for (const h of hurdles){
      h.x -= speed*dt;
      if (!h.hit && h.x < dx+26 && h.x+14 > dx-26 && dy > GROUND - h.h + 4){
        h.hit = true; lives--; hurt = 1; beep(160,.2,'sawtooth');
      }
      if (!h.passed && h.x + 14 < dx - 26){ h.passed = true; if (!h.hit){ cleared++; beep(880,.05); } }
    }
    hurdles = hurdles.filter(h => h.x > -30); hurt -= dt;
    ctx.fillStyle = '#bfe9ff'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff';
    for (const c of clouds){ const cx = ((c[0] - dist*.15) % (W+100) + W+100) % (W+100) - 50; ctx.beginPath(); ctx.arc(cx,c[1],18,0,7); ctx.arc(cx+20,c[1]-8,22,0,7); ctx.arc(cx+42,c[1],16,0,7); ctx.fill(); }
    ctx.fillStyle = '#7fd67f'; ctx.fillRect(0,GROUND,W,H-GROUND);
    ctx.fillStyle = '#6cc46c'; for (let i=0;i<14;i++){ const gx = ((i*40 - dist) % W + W) % W; ctx.fillRect(gx, GROUND+14, 18, 4); }
    for (const h of hurdles){
      ctx.fillStyle = '#fff'; ctx.fillRect(h.x, GROUND-h.h, 4, h.h); ctx.fillRect(h.x+10, GROUND-h.h, 4, h.h);
      for (let i=0;i<3;i++){ ctx.fillStyle = i%2 ? '#fff' : '#ff4f6d'; ctx.fillRect(h.x-6 + i*9, GROUND-h.h, 9, 9); }
    }
    ctx.globalAlpha = hurt > 0 && Math.floor(hurt*16)%2 ? .35 : 1;
    const bob = y === 0 ? Math.abs(Math.sin(dist/30))*4 : 0;
    if (img.complete) ctx.drawImage(img, dx-34, dy-78-bob, 68, 76);
    ctx.globalAlpha = 1;
    hud(null, `❤️ ${'♥'.repeat(lives)}${'·'.repeat(Math.max(0,3-lives))}`, `🏁 ${cleared} / ${goal}`);
    $('#timer').textContent = '🐾 go!';
    if (cleared >= goal){ over = true; done(true, `Cleared all ${goal} hurdles!`); }
    else if (lives <= 0){ over = true; done(false, `Cleared ${cleared} of ${goal} hurdles before running out of hearts.`); }
  });
  return { stop(){ stop(); removeEventListener('keydown', kd); } };
};

GAMES.tricks = (dog, area, done) => {
  const L = dog.level, goal = Math.min(10, 3 + Math.floor(L/2)), speed = Math.max(380, 700 - L*25);
  const TR = [['sit','🪑','Sit'],['spin','🌀','Spin'],['paw','🐾','Paw'],['roll','🙃','Roll Over']];
  const TONES = { sit:392, spin:494, paw:587, roll:698 };
  area.innerHTML = `<div class="dogstage" style="padding-top:14px"><div class="floor"></div><div id="tdog" style="max-width:190px;margin:0 auto">${dogSVG(dog, dog.outfit)}</div></div>
    <div class="tricks">${TR.map(([k,e,n]) => `<button data-t="${k}" disabled><span>${e}</span>${n}</button>`).join('')}</div>`;
  const seq = []; let pos = 0, alive = true, listening = false;
  const btns = [...area.querySelectorAll('[data-t]')];
  const perform = async k => {
    const dEl = $('#tdog'), b = area.querySelector(`[data-t="${k}"]`);
    if (!dEl) return;
    dEl.className = ''; void dEl.offsetWidth; dEl.className = 'trick-' + k;
    b.classList.add('lit'); beep(TONES[k], .18, 'triangle');
    await sleep(speed*.75); b.classList.remove('lit'); await sleep(speed*.25);
  };
  const round = async () => {
    listening = false; btns.forEach(b => b.disabled = true);
    seq.push(pick(TR)[0]); pos = 0;
    hud(null, `🎯 ${goal} tricks`, `⭐ ${seq.length-1}`);
    $('#hint').textContent = 'Watch closely…'; $('#timer').textContent = '👀';
    await sleep(600);
    for (const k of seq){ if (!alive) return; await perform(k); }
    if (!alive) return;
    $('#hint').textContent = 'Your turn! Repeat the tricks.'; $('#timer').textContent = '👉';
    listening = true; btns.forEach(b => b.disabled = false);
  };
  area.querySelector('.tricks').onclick = async e => {
    const b = e.target.closest('[data-t]'); if (!b || !listening) return;
    const k = b.dataset.t;
    if (k !== seq[pos]){ listening = false; beep(150,.3,'sawtooth'); done(false, `Oops! That was ${TR.find(t=>t[0]===seq[pos])[2]}. You remembered ${seq.length-1} of ${goal}.`); return; }
    pos++; perform(k);
    if (pos === seq.length){
      listening = false; hud(null, null, `⭐ ${seq.length}`);
      if (seq.length >= goal){ await sleep(500); if (alive) done(true, `${dog.name} nailed a ${goal}-trick routine!`); }
      else { await sleep(700); if (alive) round(); }
    }
  };
  round();
  return { stop(){ alive = false; } };
};

GAMES.fetch = (dog, area, done) => {
  const L = dog.level, goal = Math.round(12 + L*1.5), dur = 25, life = Math.max(.55, 1.4 - L*.05);
  area.innerHTML = `<div class="tapzone"></div>`;
  $('#hint').textContent = 'Tap 🎾 fast — tapping a 🐱 costs 3 balls!';
  const z = area.querySelector('.tapzone');
  let t = dur, score = 0, spawn = .3, over = false;
  const stop = loop(dt => {
    if (over) return;
    t -= dt; spawn -= dt;
    if (spawn <= 0){
      spawn = Math.max(.28, .7 - L*.02);
      const cat = Math.random() < .2, el = document.createElement('div');
      el.className = 'ball'; el.textContent = cat ? '🐱' : '🎾';
      el.style.left = rnd(12, 88) + '%'; el.style.top = rnd(12, 88) + '%';
      el.onpointerdown = e => {
        e.preventDefault(); if (el.classList.contains('gone') || over) return;
        el.classList.add('gone');
        if (cat){ score = Math.max(0, score-3); beep(200,.2,'sawtooth'); } else { score++; beep(700 + score*10,.05); }
      };

      setTimeout(() => { el.classList.add('gone'); setTimeout(() => el.remove(), 250); }, life*1000);
    }
    hud(t, `🎯 ${goal}`, `🎾 ${score}`);
    if (score >= goal){ over = true; done(true, `Fetched ${score} balls!`); }
    else if (t <= 0){ over = true; done(false, `Fetched ${score} of ${goal} balls.`); }
  });
  return { stop(){ over = true; stop(); } };
};

function makeRivals(round, th){
  const target = 25 + 22*(round-1);
  const mult = [.8, .9, 1.02].sort(() => Math.random() - .5);
  const used = new Set([activeDog().name]);
  return mult.map(m => {
    let name; do { name = pick(RIVAL_NAMES); } while (used.has(name)); used.add(name);
    const breed = pick(Object.keys(BREEDS)), outfit = {};
    for (const s of SLOTS){
      if (Math.random() < Math.min(.95, .4 + round*.1)){
        const opts = Object.values(ITEMS).filter(it => it.slot === s);
        const themed = opts.filter(it => it.tags.includes(th.id));
        outfit[s] = (themed.length && Math.random() < .6 ? pick(themed) : pick(opts)).id;
      } else outfit[s] = null;
    }
    return { name, dog:{ breed, level:round }, outfit, score: Math.round(target * m * rnd(.95, 1.05)), me:false };
  });
}

function poseGame(round, isAlive, flash){
  return new Promise(res => {
    const box = $('#posebox'); box.style.display = '';
    const zoneW = Math.max(.12, .26 - round*.012), perfW = zoneW*.3, speed = .8 + Math.min(1.2, round*.12);
    let total = 0, n = 0, p = 0, dir = 1, locked = false;
    box.innerHTML = `<div class="row"><b class="grow">📸 Strike a pose! (${3} tries)</b><span class="pill" id="pscore" style="font-weight:800">+0</span></div>
      <div class="posebar"><div class="zone" style="left:${(.5-zoneW/2)*100}%;width:${zoneW*100}%"></div><div class="zone p" style="left:${(.5-perfW/2)*100}%;width:${perfW*100}%"></div><div class="mk" id="mk"></div></div>
      <button class="btn big purple" id="posebtn">POSE! 💃</button>`;
    const stop = loop(dt => { if (!isAlive()) { stop(); return; } if (locked) return;
      p += dir*speed*dt; if (p > 1){ p = 1; dir = -1; } if (p < 0){ p = 0; dir = 1; }
      const mk = $('#mk'); if (mk) mk.style.left = (p*100) + '%'; });
    const press = async () => {
      if (locked || !isAlive()) return; locked = true;
      const dist = Math.abs(p - .5);
      const [pts, word] = dist < perfW/2 ? [10,'PERFECT!'] : dist < zoneW/2 ? [7,'Fabulous!'] : dist < zoneW ? [4,'Nice!'] : [1,'Oops!'];
      total += pts; n++; $('#pscore').textContent = '+' + total;
      const pop = document.createElement('div'); pop.className = 'popup'; pop.textContent = `${word} +${pts}`;
      $('#stage').appendChild(pop); setTimeout(() => pop.remove(), 900);
      flash(); beep(pts >= 7 ? 1047 : 523, .12, 'triangle');
      await sleep(900);
      if (n >= 3){ stop(); removeEventListener('keydown', kd); res(total); return; }
      p = Math.random() < .5 ? 0 : 1; dir = p ? -1 : 1; locked = false;
    };
    const kd = e => { if (e.code === 'Space'){ e.preventDefault(); press(); } };
    addEventListener('keydown', kd);
    $('#posebtn').onclick = press;
  });
}

async function showResults(ranked, me, sc, pose, th){
  const r = state.round, place = ranked.indexOf(me), won = place === 0;
  const medals = ['🥇','🥈','🥉','4️⃣'];
  const comment = e => {
    const themed = SLOTS.filter(s => e.outfit[s] && ITEMS[e.outfit[s]].tags.includes(th.id)).length;
    const j = pick(JUDGES);
    if (themed >= 3) return `${j}: “So ${th.name.toLowerCase()}! I'm obsessed.”`;
    if (themed >= 1) return `${j}: “Love the ${th.icon} touch.”`;
    const n = SLOTS.filter(s => e.outfit[s]).length;
    return n >= 4 ? `${j}: “Stylish, but where's the theme?”` : `${j}: “A bit plain, darling.”`;
  };
  screen().innerHTML = `<div class="card"><h2 class="center">🏆 Results · ${th.icon} ${th.name}</h2><div id="res" style="margin-top:10px"></div><div id="after"></div></div>`;
  const res = $('#res');
  for (let i = ranked.length-1; i >= 0; i--){
    if (current !== 'show') return;
    const e = ranked[i];
    const el = document.createElement('div'); el.className = 'result' + (e.me ? ' me' : '');
    el.innerHTML = `<div class="pl">${medals[i]}</div><div class="mini">${dogSVG(e.dog, e.outfit, {face: i===0?'wow':'happy'})}</div>
      <div class="grow"><b>${esc(e.name)}${e.me?' (you!)':''}</b><div class="muted" style="font-size:.8rem">${comment(e)}</div></div><div class="sc">${e.score}</div>`;
    res.insertBefore(el, res.firstChild); beep(400 + (3-i)*150, .1, 'triangle');
    await sleep(i === 1 ? 1200 : 800);
  }
  state.stats.shows++;
  // The wheel's result is decided and banked before it spins, so leaving
  // mid-spin (or reloading) can't lose the money or re-roll it.
  const slices = wheelSlices(r, place), pickIdx = Math.floor(Math.random()*slices.length), amount = slices[pickIdx].amount;
  state.money += amount; state.stats.earned += amount;
  if (won){
    state.stats.wins++; state.round++; restockShop();
    giveXP(me.dog, 60 + r*10);
    tune([523,659,784,1047,1319],120); confetti(160);
  } else giveXP(me.dog, 25);
  save();
  const after = $('#after');
  after.innerHTML = `
    <div class="center" style="margin:12px 0">
      ${won ? `<div style="font-size:1.5rem;font-weight:900">${esc(me.name)} WINS! 🎉</div>`
            : `<div style="font-size:1.3rem;font-weight:900">${medals[place]} ${['','2nd','3rd','4th'][place]} place</div><p class="muted">The winner scored ${ranked[0].score}.</p>`}
      <p style="margin-top:4px"><b>Spin the prize wheel to see how much ${esc(me.name)} takes home!</b></p>
    </div>
    <div class="wheelwrap"><div class="pointer">▼</div>${wheelSVG(slices)}</div>
    <button class="btn big gold" id="spin" style="margin-top:12px">SPIN! 🎡</button>
    <div id="payout"></div>`;
  await new Promise(res => $('#spin').onclick = res);
  if (current !== 'show') return;
  $('#spin').disabled = true;
  await spinWheel(after.querySelector('.wheel'), slices.length, pickIdx);
  if (current !== 'show') return;
  $('#money').textContent = fmt$(state.money);
  const jackpot = slices[pickIdx].jackpot;
  jackpot ? (tune([784,988,1175,1568,1976],90), confetti(200)) : tune([659,880,1047],110);
  $('#spin').remove();
  $('#payout').innerHTML = `
    <div class="center" style="margin:12px 0">
      ${jackpot ? '<div style="font-size:1.4rem;font-weight:900;color:#d99500">💰 JACKPOT! 💰</div>' : ''}
      <div style="font-size:2rem;font-weight:900;color:#118a3e">+${fmt$(amount)}</div>
      ${won ? `<p class="muted">Round ${r+1} is next — the winner's wheel starts at ${fmt$(prizeFor(r+1))}!</p>`
            : `<p class="muted">Win the show for the big wheel! Level up and collect cooler clothes (especially ${th.icon} ${th.name} ones).</p>`}
    </div>
    <table class="breakdown"><tr><td>👗 Outfit</td><td>${sc.itemPts}</td></tr><tr><td>${th.icon} On theme</td><td>+${sc.themePts}</td></tr><tr><td>🧩 Full outfit</td><td>+${sc.full}</td></tr><tr><td>💖 Charm</td><td>+${sc.charm}</td></tr><tr><td>📸 Poses</td><td>+${pose}</td></tr><tr><td><b>Total</b></td><td>${me.score}</td></tr></table>
    <div class="row" style="margin-top:14px"><button class="btn ghost grow" data-go="home">Home</button><button class="btn grow" data-go="${won ? 'shop' : 'challenges'}">${won ? 'Go shopping 🛍️' : 'Train more 🏆'}</button></div>`;
  $('#payout').querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  await flushModals();
}

/* ---------- prize wheel ---------- */
// Multiples of the round prize. The winner's wheel never pays less than the
// round prize itself; everyone else spins a smaller wheel for their place.
const WHEEL_MULTS = [
  [1, 1.5, 1, 2, 1, 1.25, 1, 3],
  [.1, .25, .1, .5, .1, .25, .1, .75],
  [.05, .1, .05, .25, .05, .1, .05, .4],
  [.02, .05, .02, .1, .02, .05, .02, .2],
];
const WHEEL_COLS = ['#ff5fa2','#7b3fe4','#39c0ff','#ff8a3d','#ff5fa2','#7ed957','#39c0ff','#ffb800'];
function wheelSlices(round, place){
  const mults = WHEEL_MULTS[place], top = Math.max(...mults);
  return mults.map(m => ({ amount: Math.round(prizeFor(round)*m/10)*10, jackpot: m === top }));
}
function wheelSVG(slices){
  const n = slices.length, step = 360/n, R = 140, pt = (deg, r) => { const a = deg*Math.PI/180; return [(150 + r*Math.sin(a)).toFixed(1), (150 - r*Math.cos(a)).toFixed(1)]; };
  let s = `<svg viewBox="0 0 300 300" class="wheel" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="150" r="148" fill="#fff"/>`;
  slices.forEach((sl, i) => {
    const c = i*step, [x1,y1] = pt(c - step/2, R), [x2,y2] = pt(c + step/2, R);
    s += `<path d="M150 150 L${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2} Z" fill="${sl.jackpot ? '#ffd23f' : WHEEL_COLS[i % WHEEL_COLS.length]}" stroke="#fff" stroke-width="3"/>`;
    s += `<g transform="rotate(${c} 150 150)">${sl.jackpot ? `<text x="150" y="36" text-anchor="middle" font-size="15">💰</text>` : ''}
      <text x="150" y="${sl.jackpot ? 56 : 44}" text-anchor="middle" font-size="${fmt$(sl.amount).length > 6 ? 15 : 18}" font-weight="900" fill="${sl.jackpot ? '#7a4a00' : '#fff'}" stroke="${sl.jackpot ? 'none' : '#0003'}" stroke-width=".8">${fmt$(sl.amount)}</text></g>`;
  });
  return s + `<circle cx="150" cy="150" r="24" fill="#fff" stroke="#7b3fe4" stroke-width="5"/><text x="150" y="158" text-anchor="middle" font-size="22">🐾</text></svg>`;
}
// Slice i is centred at i*step degrees clockwise from the top pointer.
function spinWheel(el, n, idx){
  return new Promise(res => {
    const step = 360/n, end = 360*6 + (360 - idx*step) + rnd(-step*.35, step*.35), dur = 4200, t0 = performance.now();
    const ptr = el.parentNode.querySelector('.pointer');
    let lastSlice = 0;
    const frame = t => {
      const k = Math.min(1, (t - t0)/dur), ease = 1 - Math.pow(1 - k, 4), rot = end*ease;
      el.style.transform = `rotate(${rot}deg)`;
      const sl = Math.floor((rot + step/2)/step);
      if (sl !== lastSlice){ lastSlice = sl; beep(1200, .02, 'square', .03); ptr.classList.remove('tick'); void ptr.offsetWidth; ptr.classList.add('tick'); }
      if (k < 1) requestAnimationFrame(frame); else res();
    };
    requestAnimationFrame(frame);
  });
}

/* =====================================================================
   BOOT
   ===================================================================== */
state = load();
if (state) go('home'); else SCREENS.start();
</script>
