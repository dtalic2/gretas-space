<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#8fd16a">
  <title>M-I-L-B-I-L Garden</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <div class="loading" id="loading"><div>🌻</div><p>Growing your garden…</p></div>

  <header class="hud">
    <button class="me" id="me" title="Change your milbil">
      <span id="meAvatar"></span>
      <span class="me-name"><b id="meName">Your milbil</b><small>✏️ customise</small></span>
    </button>
    <div class="stats">
      <div class="stat coins" title="Coins"><span class="coin"></span><b id="coins">10</b></div>
      <div class="stat" title="Market day">📅 <b id="day">1</b>
        <div class="daybar"><i id="daybar"></i></div>
      </div>
      <div class="stat" title="Storage: harvested crops waiting at home">📦 <b id="storage">0/20</b></div>
      <div class="stat" title="Your market stall">🎪 <b id="stallcount">0/12</b></div>
    </div>
  </header>

  <div class="news" id="news"></div>

  <nav class="camnav" id="camnav">
    <button data-cam="stall" class="run" title="Run to your stall">🏃<span>My stall</span></button>
    <button data-cam="farm" title="Look at your farm">🌾<span>Farm</span></button>
    <button data-cam="market" title="Look at the market">🏪<span>Market</span></button>
    <button data-cam="build" title="Look at your buildings">🏗️<span>Yard</span></button>
  </nav>

  <footer class="dock">
    <div class="seedrow">
      <div class="seeds" id="seeds"></div>
    </div>
    <div class="dockrow">
      <button class="act" id="plantAll" title="Plant the chosen seed in every empty plot">🌱<span>Plant all</span></button>
      <button class="act green" id="harvestAll" title="Harvest every ripe plot">🧺<span>Harvest</span></button>
      <span class="sep"></span>
      <button class="navbtn" data-tab="market">🏪<span>Sell</span></button>
      <button class="navbtn" data-tab="land">🗺️<span>Land</span></button>
      <button class="navbtn" data-tab="build">🔨<span>Build</span></button>
      <button class="navbtn" data-tab="shed">📦<span>Storage</span></button>
      <button class="navbtn" data-tab="news">📰<span>News</span></button>
    </div>
  </footer>

  <aside class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-head">
      <h2 id="sheetTitle">Market</h2>
      <button class="close" id="sheetClose" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body">
      <div class="tab-body" id="tab-market"></div>
      <div class="tab-body" id="tab-land" hidden></div>
      <div class="tab-body" id="tab-build" hidden></div>
      <div class="tab-body" id="tab-shed" hidden></div>
      <div class="tab-body" id="tab-news" hidden><ul class="log" id="log"></ul></div>
    </div>
  </aside>

  <div class="toasts" id="toasts"></div>

  <dialog id="dayReport">
    <form method="dialog">
      <h2 id="drTitle"></h2>
      <div id="drBody"></div>
      <button class="btn green big">Start the new day ☀️</button>
    </form>
  </dialog>

  <dialog id="editor">
    <form method="dialog" id="editorForm">
      <h2 id="edTitle">🌻 Make your milbil</h2>
      <div class="ed-top">
        <div class="ed-preview" id="edPreview"></div>
        <div class="ed-name">
          <label for="edName">Name</label>
          <input id="edName" maxlength="14" autocomplete="off" spellcheck="false" placeholder="Pick a name">
          <div class="ed-name-btns">
            <button type="button" class="btn small" id="edRandName">🎲 Random name</button>
            <button type="button" class="btn small" id="edRandAll">✨ Surprise me</button>
          </div>
        </div>
      </div>
      <div class="ed-group"><h3>Colour</h3><div class="swatches" id="edColors"></div></div>
      <div class="ed-group"><h3>Hat</h3><div class="options" id="edHats"></div></div>
      <div class="ed-group"><h3>Eyes</h3><div class="options" id="edEyes"></div></div>
      <div class="ed-group"><h3>Extra</h3><div class="options" id="edExtras"></div></div>
      <p class="ed-err" id="edErr"></p>
      <div class="ed-actions">
        <button type="button" class="btn" id="edCancel">Cancel</button>
        <button type="submit" class="btn green big" id="edSave">Let's farm! 🌱</button>
      </div>
    </form>
  </dialog>

  <dialog id="helperDlg">
    <form method="dialog" id="helperForm">
      <h2 id="hdTitle">🧺 Meet your stall keeper!</h2>
      <p class="muted" id="hdText">This milbil will mind your market stall, cheer every sale and ring the bell. What should they be called?</p>
      <div class="ed-top">
        <div class="ed-preview" id="hdPreview"></div>
        <div class="ed-name">
          <label for="hdName">Stall keeper's name</label>
          <input id="hdName" maxlength="14" autocomplete="off" spellcheck="false" placeholder="Pick a name">
          <div class="ed-name-btns">
            <button type="button" class="btn small" id="hdRand">🎲 Random name</button>
          </div>
        </div>
      </div>
      <div class="ed-group"><h3>Colour</h3><div class="swatches" id="hdColors"></div></div>
      <p class="ed-err" id="hdErr"></p>
      <div class="ed-actions">
        <button type="button" class="btn" id="hdLater">Later</button>
        <button type="submit" class="btn green big" id="hdSave">Welcome aboard! 🧺</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
