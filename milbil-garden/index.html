<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8fd16a">
  <title>M-I-L-B-I-L Garden</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <button class="me" id="me" title="Change your milbil">
        <span id="meAvatar"></span>
        <span class="me-name"><b id="meName">Your milbil</b><small>✏️ customise</small></span>
      </button>
      <h1><span>M-I-L-B-I-L</span> Garden</h1>
    </div>
    <div class="stats">
      <div class="stat coins" title="Coins"><span class="coin"></span><b id="coins">10</b></div>
      <div class="stat" title="Market day">📅 Day <b id="day">1</b>
        <div class="daybar"><i id="daybar"></i></div>
      </div>
      <div class="stat" title="Storage: harvested crops waiting at home">📦 <b id="storage">0/20</b></div>
      <div class="stat" title="Your market stall">🎪 <b id="stallcount">0/12</b></div>
    </div>
  </header>

  <div class="news" id="news"></div>

  <main>
    <section class="farm card">
      <div class="farm-head">
        <h2><span id="farmTitle">🌾 Your Farm</span> <small id="plotcount"></small></h2>
        <div class="farm-actions">
          <button class="btn" id="plantAll">🌱 Plant all</button>
          <button class="btn green" id="harvestAll">🧺 Harvest all</button>
        </div>
      </div>
      <div class="seeds" id="seeds"></div>
      <div class="field" id="field"></div>
      <p class="hint">Pick a seed, then tap soil to plant. Tap ✨ ripe crops to harvest them into storage. Then head to the <b>Market</b> to sell.</p>
    </section>

    <section class="panel card">
      <nav class="tabs" id="tabs">
        <button data-tab="market" class="on">🏪 Market</button>
        <button data-tab="land">🗺️ Land</button>
        <button data-tab="build">🔨 Build</button>
        <button data-tab="shed">📦 Storage</button>
      </nav>
      <div class="tab-body" id="tab-market"></div>
      <div class="tab-body" id="tab-land" hidden></div>
      <div class="tab-body" id="tab-build" hidden></div>
      <div class="tab-body" id="tab-shed" hidden></div>
    </section>
  </main>

  <section class="ticker card">
    <h3>📰 Around the market</h3>
    <ul id="log"></ul>
  </section>

  <div class="toasts" id="toasts"></div>

  <dialog id="dayReport">
    <form method="dialog">
      <h2 id="drTitle"></h2>
      <div id="drBody"></div>
      <button class="btn green big">Start the new day ☀️</button>
    </form>
  </dialog>

  <dialog id="editor">
    <form method="dialog" id="editorForm">
      <h2 id="edTitle">🌻 Make your milbil</h2>
      <div class="ed-top">
        <div class="ed-preview" id="edPreview"></div>
        <div class="ed-name">
          <label for="edName">Name</label>
          <input id="edName" maxlength="14" autocomplete="off" spellcheck="false" placeholder="Pick a name">
          <div class="ed-name-btns">
            <button type="button" class="btn small" id="edRandName">🎲 Random name</button>
            <button type="button" class="btn small" id="edRandAll">✨ Surprise me</button>
          </div>
        </div>
      </div>
      <div class="ed-group"><h3>Colour</h3><div class="swatches" id="edColors"></div></div>
      <div class="ed-group"><h3>Hat</h3><div class="options" id="edHats"></div></div>
      <div class="ed-group"><h3>Eyes</h3><div class="options" id="edEyes"></div></div>
      <div class="ed-group"><h3>Extra</h3><div class="options" id="edExtras"></div></div>
      <p class="ed-err" id="edErr"></p>
      <div class="ed-actions">
        <button type="button" class="btn" id="edCancel">Cancel</button>
        <button type="submit" class="btn green big" id="edSave">Let's farm! 🌱</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
