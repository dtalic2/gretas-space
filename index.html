<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SNK CLSH - Snake Clash</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: -apple-system, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            overscroll-behavior: none;
        }
        h1 {
            font-size: 2.4rem;
            margin-bottom: 4px;
            color: #4ade80;
            text-shadow: 0 0 30px rgba(74, 222, 128, 0.4);
            letter-spacing: 6px;
            font-weight: 900;
        }
        .hero-canvas-wrap {
            margin-bottom: 8px;
            width: 100%;
            max-width: 400px;
        }
        #hero-canvas {
            display: block;
            border-radius: 8px;
            width: 100%;
            height: auto;
        }
        .version-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .version-btn {
            padding: 10px 18px;
            border: 2px solid #333;
            background: #1a1a1a;
            color: #aaa;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            -webkit-tap-highlight-color: rgba(74,222,128,0.2);
        }
        .version-btn.active {
            background: #4ade80;
            color: #0a0a0a;
            border-color: #4ade80;
            font-weight: bold;
        }
        .version-info {
            text-align: center;
            margin-bottom: 8px;
            color: #888;
            font-size: 0.8rem;
            padding: 0 10px;
        }
        .version-info strong { color: #4ade80; }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
        }
        canvas#game-canvas {
            border: 2px solid #333;
            border-radius: 4px;
            display: block;
            width: 100%;
            height: auto;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        .hud span { color: #4ade80; }
        .controls-help {
            margin-top: 10px;
            color: #555;
            font-size: 0.75rem;
            text-align: center;
        }

        /* ===== MOBILE CONTROLS ===== */
        .mobile-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
            max-width: 400px;
        }
        .mobile-btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        .mbtn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 14px;
            color: #4ade80;
            font-weight: bold;
            cursor: pointer;
            -webkit-tap-highlight-color: rgba(74,222,128,0.3);
            -webkit-user-select: none;
            user-select: none;
        }
        .mbtn-action {
            padding: 16px 0;
            flex: 1;
            max-width: 130px;
            font-size: 0.95rem;
        }
        .mbtn-dir {
            width: 60px;
            height: 60px;
            font-size: 1.6rem;
        }
        .dpad {
            display: grid;
            grid-template-areas:
                ".    up   ."
                "left mid  right"
                ".    down .";
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 4px;
        }
        .dpad-up    { grid-area: up; }
        .dpad-down  { grid-area: down; }
        .dpad-left  { grid-area: left; }
        .dpad-right { grid-area: right; }
        .dpad-mid   {
            grid-area: mid;
            background: rgba(74,222,128,0.04);
            border: 1px solid #222;
            border-radius: 14px;
        }

        .footer {
            margin-top: 20px;
            padding: 12px 24px;
            color: #4ade80;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: lowercase;
            border-top: 1px solid #222;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
        }
        @media (max-width: 440px) {
            h1 { font-size: 2rem; letter-spacing: 4px; }
        }
        @media (pointer: coarse), (hover: none) {
            .mobile-controls { display: flex; }
            .controls-help { display: none; }
        }
    </style>
</head>
<body>
    <h1>SNK CLSH</h1>

    <div class="hero-canvas-wrap">
        <canvas id="hero-canvas" width="400" height="220"></canvas>
    </div>

    <div class="version-bar" id="version-bar"></div>
    <div class="version-info" id="version-info"></div>

    <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>High Score: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="400" height="400"></canvas>
    </div>

    <div class="controls-help">Arrow Keys or WASD to move &bull; Space to pause &bull; Enter to restart</div>

    <div class="mobile-controls">
        <div class="mobile-btn-row">
            <div class="mbtn mbtn-action" onclick="window._snkPlay()">PLAY</div>
            <div class="mbtn mbtn-action" onclick="window._snkPause()">PAUSE</div>
        </div>
        <div class="dpad">
            <div class="mbtn mbtn-dir dpad-up"    onclick="window._snkDir('up')">&#9650;</div>
            <div class="mbtn mbtn-dir dpad-left"   onclick="window._snkDir('left')">&#9664;</div>
            <div class="dpad-mid"></div>
            <div class="mbtn mbtn-dir dpad-right"  onclick="window._snkDir('right')">&#9654;</div>
            <div class="mbtn mbtn-dir dpad-down"   onclick="window._snkDir('down')">&#9660;</div>
        </div>
    </div>

    <div class="footer">updated snake clash</div>

    <script src="hero.js"></script>
    <script src="versions/registry.js"></script>
    <script src="versions/v1-classic.js"></script>
    <script src="versions/v2-speed-ramp.js"></script>
    <script src="versions/v3-walls-and-portals.js"></script>
    <script src="engine.js"></script>
</body>
</html>
