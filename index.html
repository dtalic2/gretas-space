<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SNK CLSH - Snake Clash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
            touch-action: manipulation;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            padding: 15px;
            padding-top: env(safe-area-inset-top, 15px);
            padding-bottom: env(safe-area-inset-bottom, 15px);
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 4px;
            color: #4ade80;
            text-shadow: 0 0 30px rgba(74, 222, 128, 0.4), 0 0 60px rgba(74, 222, 128, 0.15);
            letter-spacing: 6px;
            font-weight: 900;
        }

        .hero-canvas-wrap {
            margin-bottom: 10px;
            max-width: 100%;
        }

        #hero-canvas {
            display: block;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }

        .version-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .version-btn {
            padding: 8px 16px;
            border: 2px solid #333;
            background: #1a1a1a;
            color: #aaa;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .version-btn:hover {
            border-color: #4ade80;
            color: #4ade80;
        }

        .version-btn.active {
            background: #4ade80;
            color: #0a0a0a;
            border-color: #4ade80;
            font-weight: bold;
        }

        .version-info {
            text-align: center;
            margin-bottom: 10px;
            color: #888;
            font-size: 0.8rem;
            padding: 0 10px;
        }

        .version-info strong {
            color: #4ade80;
        }

        #game-container {
            position: relative;
            max-width: 100%;
        }

        canvas#game-canvas {
            border: 2px solid #333;
            border-radius: 4px;
            display: block;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .hud span {
            color: #4ade80;
        }

        .controls-help {
            margin-top: 10px;
            color: #555;
            font-size: 0.75rem;
            text-align: center;
            padding: 0 10px;
        }

        /* ===== TOUCH D-PAD ===== */
        .dpad {
            display: none;
            margin-top: 14px;
            position: relative;
            width: 160px;
            height: 160px;
            flex-shrink: 0;
        }

        .dpad-btn {
            position: absolute;
            width: 52px;
            height: 52px;
            background: rgba(74, 222, 128, 0.12);
            border: 2px solid rgba(74, 222, 128, 0.35);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ade80;
            font-size: 1.4rem;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: background 0.1s;
        }

        .dpad-btn:active, .dpad-btn.pressed {
            background: rgba(74, 222, 128, 0.35);
            border-color: #4ade80;
        }

        .dpad-up    { top: 0;    left: 54px; }
        .dpad-down  { bottom: 0; left: 54px; }
        .dpad-left  { top: 54px; left: 0;    }
        .dpad-right { top: 54px; right: 0;   }

        .dpad-center {
            position: absolute;
            top: 54px;
            left: 54px;
            width: 52px;
            height: 52px;
            background: rgba(74, 222, 128, 0.06);
            border: 1px solid rgba(74, 222, 128, 0.15);
            border-radius: 12px;
        }

        .touch-action-bar {
            display: none;
            gap: 12px;
            margin-top: 10px;
        }

        .touch-action-btn {
            padding: 10px 22px;
            background: rgba(74, 222, 128, 0.12);
            border: 2px solid rgba(74, 222, 128, 0.35);
            border-radius: 10px;
            color: #4ade80;
            font-size: 0.9rem;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: background 0.1s;
        }

        .touch-action-btn:active {
            background: rgba(74, 222, 128, 0.35);
        }

        .footer {
            margin-top: 20px;
            padding: 12px 24px;
            color: #4ade80;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: lowercase;
            border-top: 1px solid #222;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
        }

        /* Responsive */
        @media (max-width: 440px) {
            h1 { font-size: 2rem; letter-spacing: 4px; }
            body { padding: 10px; }
            .version-btn { padding: 6px 12px; font-size: 0.78rem; }
        }

        /* Show touch controls on touch devices */
        @media (pointer: coarse) {
            .dpad { display: block; }
            .touch-action-bar { display: flex; }
            .controls-help { display: none; }
        }
    </style>
</head>
<body>
    <h1>SNK CLSH</h1>

    <div class="hero-canvas-wrap">
        <canvas id="hero-canvas" width="400" height="220"></canvas>
    </div>

    <div class="version-bar" id="version-bar"></div>
    <div class="version-info" id="version-info"></div>

    <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>High Score: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="400" height="400"></canvas>
    </div>

    <div class="controls-help">Arrow Keys or WASD to move &bull; Space to pause &bull; Enter to restart</div>

    <!-- Touch D-Pad -->
    <div class="dpad" id="dpad">
        <div class="dpad-btn dpad-up" data-dir="up">&#9650;</div>
        <div class="dpad-btn dpad-left" data-dir="left">&#9664;</div>
        <div class="dpad-center"></div>
        <div class="dpad-btn dpad-right" data-dir="right">&#9654;</div>
        <div class="dpad-btn dpad-down" data-dir="down">&#9660;</div>
    </div>

    <!-- Touch action buttons -->
    <div class="touch-action-bar" id="touch-actions">
        <button class="touch-action-btn" id="btn-start">START</button>
        <button class="touch-action-btn" id="btn-pause">PAUSE</button>
    </div>

    <div class="footer">updated snake clash</div>

    <!-- Hero artwork -->
    <script src="hero.js"></script>

    <!-- Version registry - add new versions here -->
    <script src="versions/registry.js"></script>

    <!-- Game versions loaded in release order -->
    <script src="versions/v1-classic.js"></script>
    <script src="versions/v2-speed-ramp.js"></script>
    <script src="versions/v3-walls-and-portals.js"></script>

    <!-- Core engine (loaded last, uses registered versions) -->
    <script src="engine.js"></script>
</body>
</html>
